<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>popnei in a web worker</title>
  </head>
  <body>
    <!--
      The page a browser test opens. It starts the web worker of
      `worker.ts`, which is where popnei runs, and gives the test
      `runInTheWorker`, which asks the worker for one case and gives back a
      promise that is rejected with the message of the assertion that
      failed inside it. The page itself neither loads the WebAssembly nor
      reads a file: everything a test asserts happens in the worker.
    -->
    <script type="module">
      const worker = new Worker("./worker.ts", { type: "module" });
      const waiting = new Map();
      let lastAsked = 0;

      worker.addEventListener("message", (event) => {
        const { id, failure } = event.data;
        const settle = waiting.get(id);
        waiting.delete(id);
        if (settle === undefined) {
          return;
        }
        if (failure === null) {
          settle.ran();
        } else {
          settle.failed(new Error(failure));
        }
      });

      // A worker that cannot be loaded at all, or that throws where no case
      // of it catches, answers nothing, so every case that is waiting is
      // told, and the test reads the message instead of timing out.
      worker.addEventListener("error", (event) => {
        for (const settle of waiting.values()) {
          settle.failed(new Error(event.message ?? "the worker failed"));
        }
        waiting.clear();
      });

      window.runInTheWorker = (name) =>
        new Promise((ran, failed) => {
          lastAsked += 1;
          waiting.set(lastAsked, { ran, failed });
          worker.postMessage({ id: lastAsked, case: name });
        });
    </script>
  </body>
</html>
