<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>popnei: what a range of a file costs</title>
  </head>
  <body>
    <!--
      The page `bench/time_ranges_in_chromium.mjs` opens. It starts the web
      worker of `ranges_worker.js`, where popnei runs, and gives the driver
      `measureInTheWorker`, which asks the worker for one measurement and
      gives back its numbers, or rejects with the message of what failed
      inside it.

      It is the page of `test/browser/harness.html` with the numbers of a
      measurement in the answer instead of a pass or a failure. The two are
      apart because a browser test says whether a value is the right one
      and a measurement says how long something took: a harness that did
      both would run the timings of a few hundred MB on every `npm run
      test:browser`.
    -->
    <script type="module">
      const worker = new Worker("./ranges_worker.js", { type: "module" });
      const waiting = new Map();
      let lastAsked = 0;

      worker.addEventListener("message", (event) => {
        const { id, measured, failure } = event.data;
        const settle = waiting.get(id);
        waiting.delete(id);
        if (settle === undefined) {
          return;
        }
        if (failure === null) {
          settle.measured(measured);
        } else {
          settle.failed(new Error(failure));
        }
      });

      // A worker that cannot be loaded at all answers nothing, so every ask
      // that is waiting is told and the driver reads the message instead of
      // waiting for a measurement that will not come.
      worker.addEventListener("error", (event) => {
        const failure =
          event.message ||
          "the worker `./ranges_worker.js` did not load, and the browser " +
            "gave no message: ask the server for that address and for " +
            "whatever that file imports at its head";
        for (const settle of waiting.values()) {
          settle.failed(new Error(failure));
        }
        waiting.clear();
      });

      window.measureInTheWorker = (ask) =>
        new Promise((measured, failed) => {
          lastAsked += 1;
          waiting.set(lastAsked, { measured, failed });
          worker.postMessage({ id: lastAsked, ask });
        });
    </script>
  </body>
</html>
