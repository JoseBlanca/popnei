[package]
name = "popnei-python"
description = "Population genetics: the Python binding crate, pyo3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
# The module a Python user never imports directly: popnei._core, built by
# maturin, which pyproject.toml points at this manifest. The name of the
# library is the last part of the name of the module.
name = "_core"
crate-type = ["cdylib"]
# There are no cargo tests here: the calculations are tested in the core
# crate and what this crate adds is tested from Python, as
# .claude/skills/coding/pyo3.md says. Nor could there be one without more
# work. The library is an extension module, so its Python symbols are left
# undefined for the interpreter that loads it to resolve, which is what
# .cargo/config.toml and build.rs arrange; a test binary is not loaded by
# an interpreter, so it would have to find and link a libpython instead.
test = false
doctest = false

# The feature of the core crate, which is the one of crates/popnei-linalg,
# passed on so that a wheel can be built without the BLAS and LAPACK of
# the system: with it off the linear algebra runs on faer and nothing
# links a library of the system. docs/specs/linalg.md says what it is for.
[features]
default = ["blas"]
blas = ["popnei/blas"]

[dependencies]
numpy.workspace = true
popnei.workspace = true
pyo3.workspace = true

[build-dependencies]
pyo3-build-config.workspace = true

[lints]
workspace = true
