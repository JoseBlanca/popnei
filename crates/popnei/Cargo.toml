[package]
name = "popnei"
description = "Population genetics: the core crate, pure Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

# The feature that crates/popnei-linalg has, passed on so that a build of
# this crate can turn it off. With it, which is the default, the linear
# algebra runs on the BLAS and LAPACK of the system natively; without it,
# on faer, and then nothing of popnei links a library of the system, so a
# machine with no BLAS and no Fortran compiler builds it and the two
# backends can be compared on one machine by building the same thing
# twice, which is what docs/specs/linalg.md asks of the feature. The wasm
# targets have no BLAS and the feature changes nothing there.
[features]
default = ["blas"]
blas = ["popnei-linalg/blas"]
# What the benchmark `standardize_row` needs to time the four passes over
# a row of the principal component analysis one by one: it turns on the
# module `pca::bench_internals`, which re-exports them, and nothing else.
# They are private functions and a benchmark is a crate of its own, so
# without it nothing outside `pca` can call them. It is off by default and
# no build popnei ships turns it on: `cargo bench --bench standardize_row`
# does, through the `required-features` of that benchmark.
bench-internals = []

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
flate2.workspace = true
memchr.workspace = true
popnei-linalg.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The VCF reader parses the lines of a batch on the threads of rayon, and
# in wasm, where there are no threads, it parses them one after another:
# the parallel code is behind `cfg(not(target_family = "wasm"))` and rayon
# is not a dependency of the two wasm targets popnei ships.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon.workspace = true

[lints]
workspace = true

# The timing of the VCF reader of task 5.2 of docs/plans/vcf-to-blocks.md.
# It takes the path of a VCF, the threads and the runs on its command line
# and prints one wall time per run, so it runs without a harness: criterion
# times a function that is called again and again, and this one times a
# whole read of a 400 MB file.
[[bench]]
name = "read_vcf"
harness = false

# The timing of the reader and the writer of a vars file of work package 4
# of docs/plans/vars-file.md, against the 21 ms of "Speed" of
# docs/specs/io_vars.md. It takes the path of a vars file and the runs on
# its command line and prints one wall time per run, so it runs without a
# harness, as read_vcf does.
[[bench]]
name = "vars_file"
harness = false

# What the missing data filter costs a whole pass, of work package 4 of
# docs/plans/filters.md, which is what "Speed" of docs/specs/filters.md
# states. It takes the path of a VCF or of a vars file, the threads, the
# runs and the threshold on its command line and prints one wall time per
# run, so it runs without a harness, as the two above do.
[[bench]]
name = "filter_vars"
harness = false

# How long the principal component analysis of the variants of a file
# takes, of work package 4 of docs/plans/pca.md, against the 0.3 s of
# "Speed" of docs/specs/pca.md. It takes the path of a VCF or of a vars
# file, the runs and how many components the weights are given for, and
# prints one wall time per run, so it runs without a harness, as the three
# above do. It builds no pool of threads: those come from
# RAYON_NUM_THREADS and VECLIB_MAXIMUM_THREADS in the environment of the
# command.
[[bench]]
name = "pca_vars"
harness = false

# How long each of the four passes over a row of the principal component
# analysis takes, of the performance review of
# docs/reports/perf-pca-2026-09-22.md, whose first experiment it is. The
# profile of a whole analysis sees the four as one frame, because the
# compiler inlines them, so this one calls each over the rows of one real
# block and prints a time for each. It takes the path of a vars file and
# the runs on its command line, so it runs without a harness, as the four
# above do, and it needs the cargo feature that makes the four reachable.
[[bench]]
name = "standardize_row"
harness = false
required-features = ["bench-internals"]
