[package]
name = "popnei"
description = "Population genetics: the core crate, pure Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

# The feature that crates/popnei-linalg has, passed on so that a build of
# this crate can turn it off. With it, which is the default, the linear
# algebra runs on the BLAS and LAPACK of the system natively; without it,
# on faer, and then nothing of popnei links a library of the system, so a
# machine with no BLAS and no Fortran compiler builds it and the two
# backends can be compared on one machine by building the same thing
# twice, which is what docs/specs/linalg.md asks of the feature. The wasm
# targets have no BLAS and the feature changes nothing there.
[features]
default = ["blas"]
blas = ["popnei-linalg/blas"]
# What two benchmarks need to call a private function of the library: the
# modules `variant::bench_internals`, which re-exports the four passes that
# turn a variant into standardized dosages so that `standardize_row` times
# them one by one, and `ld::bench_internals`, which re-exports the matrix
# of r² with the size of its tiles given, so that `r2_matrix` times the
# matrix at a tile the library does not choose. Both are private and a
# benchmark is a crate of its own, so without this nothing outside those
# two modules can call them. It is off by default and no build popnei ships
# turns it on: `cargo bench` does, through the `required-features` of those
# two benchmarks.
bench-internals = []

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
flate2.workspace = true
libm.workspace = true
memchr.workspace = true
popnei-linalg.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The VCF reader parses the lines of a batch on the threads of rayon, and
# in wasm, where there are no threads, it parses them one after another:
# the parallel code is behind `cfg(not(target_family = "wasm"))` and rayon
# is not a dependency of the two wasm targets popnei ships.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon.workspace = true

[lints]
workspace = true

# The timing of the VCF reader of task 5.2 of docs/plans/vcf-to-blocks.md.
# It takes the path of a VCF, the threads and the runs on its command line
# and prints one wall time per run, so it runs without a harness: criterion
# times a function that is called again and again, and this one times a
# whole read of a 400 MB file.
[[bench]]
name = "read_vcf"
harness = false

# The timing of the reader and the writer of a vars file of work package 4
# of docs/plans/vars-file.md, against the 21 ms of "Speed" of
# docs/specs/io_vars.md. It takes the path of a vars file and the runs on
# its command line and prints one wall time per run, so it runs without a
# harness, as read_vcf does.
[[bench]]
name = "vars_file"
harness = false

# What the missing data filter costs a whole pass, of work package 4 of
# docs/plans/filters.md, which is what "Speed" of docs/specs/filters.md
# states. It takes the path of a VCF or of a vars file, the threads, the
# runs and the threshold on its command line and prints one wall time per
# run, so it runs without a harness, as the two above do.
[[bench]]
name = "filter_vars"
harness = false

# What the per variant pass of the stats module costs over blocks that are
# already in memory, of the performance review of
# docs/reports/perf-stats-2026-09-22.md. It builds one block, gives it to
# the pass a stated number of times and prints one wall time per run, so it
# runs without a harness, as the three above do.
[[bench]]
name = "stats_pass"
harness = false

# How long the Kosman distance of every pair of individuals takes, of the
# performance review of docs/specs/dists.md, against the 0.97 s on one
# thread and the 0.38 s on 18 cores of "Speed" of that spec. It takes the
# path of a vars file and the runs on its command line and prints one wall
# time per run, so it runs without a harness, as the four above do.
[[bench]]
name = "kosman_dists"
harness = false

# How long the principal component analysis of the variants of a file
# takes, of work package 4 of docs/plans/pca.md, against the 0.3 s of
# "Speed" of docs/specs/pca.md. It takes the path of a VCF or of a vars
# file, the runs and how many components the weights are given for, and
# prints one wall time per run, so it runs without a harness, as the five
# above do. It builds no pool of threads: those come from
# RAYON_NUM_THREADS and VECLIB_MAXIMUM_THREADS in the environment of the
# command.
[[bench]]
name = "pca_vars"
harness = false

# How long each of the four passes that turn a variant into standardized
# dosages takes, which the principal components of the variants and the
# kinship both walk, of the performance review of
# docs/reports/perf-pca-2026-09-22.md, whose first experiment it is. The
# profile of a whole analysis sees the four as one frame, because the
# compiler inlines them, so this one calls each over the rows of one real
# block and prints a time for each. It takes the path of a vars file and
# the runs on its command line, so it runs without a harness, as the six
# above do, and it needs the cargo feature that makes the four reachable.
[[bench]]
name = "standardize_row"
harness = false
required-features = ["bench-internals"]

# How long the matrix of r² of every pair of a set of variants takes, of
# work package 4 of docs/plans/ld.md, deferred there to a performance
# review, against the 0.50 s of "Speed" of docs/specs/ld.md for 5000
# variants of 1000 individuals. It takes the path of a vars file, the runs,
# how many variants the matrix is of and how many variants a tile of the
# products holds, and prints one wall time per run, so it runs without a
# harness, as the seven above do. The tile is the private constant that
# review settles, and the cargo feature is what makes it reachable.
[[bench]]
name = "r2_matrix"
harness = false
required-features = ["bench-internals"]


# How long the seven distances between every pair of populations take, of
# the performance review of that pass, which "Speed" of
# docs/specs/dists.md gives no number to reach and leaves the measurement
# of to the review. It takes the path of a vars file, one or
# more files of the population of each individual, the runs and how the
# variants are cut into the resampling groups, and prints one wall time per
# run, so it runs without a harness, as the eight above do.
[[bench]]
name = "pop_dists"
harness = false

# How long the kinship of every pair of the individuals of a file takes, of
# the performance review of docs/reports/perf-kinship-2026-09-23.md, which
# is the first measurement popnei has of it, against the 0.23 s of plink2
# that "Speed" of docs/specs/kinship.md states for 100000 variants of 1000
# individuals with every genotype called. It takes the path of a VCF or of
# a vars file, the runs and how many principal components of the matrix are
# taken, and prints one wall time per run, so it runs without a harness, as
# the nine above do.
[[bench]]
name = "kinship"
harness = false
