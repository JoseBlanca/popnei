[workspace]
resolver = "3"
members = [
  "crates/popnei",
  "crates/popnei-linalg",
  "crates/popnei-python",
  "crates/popnei-js",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The rustc popnei is built and tested with, and not a measured minimum:
# no older toolchain has been tried. What the manifests use needs less,
# 1.85 for edition 2024 and for resolver 3. Raise this line when the
# project moves to a newer rustc, and lower it when an older one is tried
# and passes the checks.
rust-version = "1.98"
repository = "https://github.com/JoseBlanca/popnei"
# The three crates, the Python package and the TypeScript package are under
# the MIT license, which the owner chose on 20 September 2026. The text is
# in LICENSE at the root of the repository, and this line is the SPDX
# identifier that cargo, crates.io and a tool that reads a manifest look at.
license = "MIT"

[workspace.dependencies]
# The crates of popnei itself. Their default features are off here and
# each crate that depends on one turns on what it wants, because cargo
# refuses a `default-features = false` on a member's line when the
# workspace's line does not have it, and the feature `blas`, which the
# linear algebra crate has and the two crates above it pass on, is one a
# build has to be able to turn off. Every crate that wants it has
# `default = ["blas"]` of its own, so the default build is unchanged.
popnei = { path = "crates/popnei", version = "0.1.0", default-features = false }
popnei-linalg = { path = "crates/popnei-linalg", version = "0.1.0", default-features = false }
# The three routines of BLAS and LAPACK that crates/popnei-linalg calls
# natively, dsyrk, dsyevd and dgemm: the product of a matrix with itself,
# the eigendecomposition of a symmetric matrix and the product of two
# matrices, which docs/specs/linalg.md names one by one. `blas` and
# `lapack` hold the declaration of each routine and nothing else, one
# `unsafe fn` over slices whose lengths nothing checks against the
# dimensions, which is why those calls live in a crate of their own and
# the core crate keeps its `forbid(unsafe_code)`. What they give is not a
# few lines of our own: dsyevd is a reduction to tridiagonal form, a
# divide and conquer solver and the back transformation of the
# eigenvectors, tuned for the caches and the vector instructions of the
# machine, and it is the routine numpy's `eigh` calls, so popnei and numpy
# compute the same eigendecomposition by the same path. Decision 5 of
# docs/rust_core.md chose the library of the system for this, and
# docs/specs/linalg.md states what the crate gives over it.
blas = "0.23"
lapack = "0.20"
# The two crates that say which library holds those routines. Neither
# ships an implementation: with the feature `accelerate` each emits the
# linker argument `-framework Accelerate`, the library of the system that
# numpy also calls on macOS, which ships nothing to build.
#
# These two lines are for macOS and for no other system: the crate that
# `accelerate` brings emits that argument whatever the target is, so a
# Linux build with these lines would ask its linker for a framework it
# has not. The Linux and Windows wheels link OpenBLAS through these same
# two crates with the feature `openblas`, and the plan that first builds
# them moves both lines under a target table, one entry per system, and
# settles what OpenBLAS needs on the machine that builds. Until then
# popnei is built on this Mac, and a machine that has no BLAS builds it
# with the feature `blas` of the core crate off. Both are native only:
# the wasm targets have no BLAS and run on faer, and the linear algebra
# crate takes these two as optional dependencies of the targets that are
# not wasm.
blas-src = { version = "0.14", features = ["accelerate"] }
lapack-src = { version = "0.13", features = ["accelerate"] }
# The other backend of crates/popnei-linalg, and the only one in
# WebAssembly, where there is no BLAS and no library of the system to
# link: a linear algebra library written in Rust, which builds for the two
# wasm targets and gives the same three operations, the triangular product
# and the general one of `linalg::matmul` and `self_adjoint_eigen`. What
# it gives is what BLAS and LAPACK give, a blocked product that uses the
# vector instructions of the target and a symmetric eigendecomposition
# with its reduction to tridiagonal form, so it is not a few lines of our
# own either: written by hand, the product of a block of 5000 variants x
# 1000 individuals would run at the speed of a triple loop, and the
# eigendecomposition is the harder half. It is also a native backend,
# behind the cargo feature of that crate, which is how the open question
# of docs/rust_core.md, whether faer is level with OpenBLAS on x86, gets
# measured: the same binary built twice. 0.24.4 is the version of the
# spike of section 3.2 of that document, which built it for emscripten.
# Of its features only `std` and `linalg` are on, and `rayon`, which does
# not build for emscripten, only off the wasm targets.
faer = { version = "0.24.4", default-features = false, features = [
  "std",
  "linalg",
] }
# The crate that does faer's products, which faer 0.24.4 brings by itself:
# `cargo tree -p popnei-linalg -i gemm` finds this one version under it and
# no other. crates/popnei-linalg names it again, for the wasm targets
# alone, to turn on the feature `wasm-simd128-enable`, without which its
# products do not use the 128 bit vector instructions of WebAssembly. This
# feature is what puts them in: gemm's kernels carry their own annotation,
# so the flag `-C target-feature=+simd128` adds nothing to the products,
# which docs/reports/pca-measurement.md measured on 22 September 2026. That
# flag is set for both wasm targets by .cargo/config.toml, where the dists
# module needs it and not these products; "The wasm builds and the vector
# instructions" of docs/specs/linalg.md has the whole of it. With the
# feature the analysis of 100000 variants x 1000 individuals takes 4.500 s
# under node 26 and without it 7.066 s.
#
# Its default features are off, as they are where faer declares it. They
# are `std`, `rayon` and `f16`, and turning them on here would put rayon
# in the two wasm trees, where there are no threads and where "Threads" of
# docs/specs/linalg.md has faer running on one, and 11 crates with it.
gemm = { version = "0.19.0", default-features = false, features = [
  "wasm-simd128-enable",
] }
# The gzip of the VCF reader, with its default backend, miniz_oxide, which
# is written in Rust and so builds for the two wasm targets.
flate2 = "1"
# The threads the VCF reader parses its batches of lines on, and the pool
# every parallel loop of popnei will run on: section 3 of
# docs/architecture.md gives rayon the records and the rows of a block, and
# the library never builds its global pool. In wasm there are no threads,
# so the core crate takes it under
# [target.'cfg(not(target_family = "wasm"))'.dependencies] and the parallel
# code is behind the same cfg, with the serial version beside it. It is
# pure Rust and pulls in crossbeam and either, all of them pure Rust too.
rayon = "1"
# The search of a byte in the bytes of a line of a VCF, which the row
# parser of the VCF reader does for every column of every individual: the
# tab that ends a column and the colon that ends the genotype in it. It
# reads the bytes a machine word at a time, and by hand the same search is
# a loop over one byte after another. It is pure Rust, it has no
# dependency, and its use of the wide instructions of a machine is behind
# a check of the target at compile time, so it builds for the two wasm
# targets.
memchr = "2"
# The vars file of docs/specs/io_vars.md, popnei's own file of variants,
# which is one arrow IPC file: arrow-ipc writes it and reads it, arrow-schema
# holds its columns and the two keys of json that say what it holds,
# arrow-array the columns of one batch, and arrow-buffer the bytes behind
# them, which is what lets the genotypes of a block become the buffer of the
# `gts` column with no copy. None of the four has a default feature, and the
# only one turned on is the lz4 of arrow-ipc, the compression popnei writes
# and reads, which arrow-ipc takes from lz4_flex, pure Rust with no build
# script. zstd, the other compression of the format, is an optional
# dependency of arrow-ipc that wraps the C library and that nothing here
# turns on, so no build of popnei carries it and `cargo tree -p popnei |
# grep -i zstd` finds nothing: "The compression" of the spec has what that
# costs, a file 2.2 times larger, and why. The four are pure Rust and build
# for the two wasm targets, and what they add that popnei did not have is
# pure Rust too, lz4_flex, flatbuffers, chrono, half, hashbrown, ahash and
# the num crates among them.
#
# Pure Rust and calling nothing of the host are not the same thing, and one
# of those crates does call something. chrono comes with its `clock`
# feature on, which arrow-array asks for, and that feature brings
# iana-time-zone, whose module for emscripten calls
# emscripten_run_script_string of the emscripten runtime to ask the host
# for the time zone; on wasm32-unknown-unknown a call for the clock aborts
# instead. Nothing of the write or the read of a vars file asks for a
# clock: `Utc::now`, `Local::now`, `SystemTime::now`, `Instant::now` and
# `RandomState::new` appear in no file of the seven arrow crates of this
# tree, of lz4_flex or of flatbuffers. So the wheel of pyodide and the wasm
# package carry that code and no path of popnei reaches it, and a later
# version of arrow-rs that reads a clock would be found by the tests of
# wasm and not by a build.
arrow-array = { version = "60", default-features = false }
arrow-buffer = { version = "60", default-features = false }
arrow-ipc = { version = "60", default-features = false, features = ["lz4"] }
arrow-schema = { version = "60", default-features = false }
# The values of the two keys of a vars file, which are json: `popnei` in the
# schema and `popnei_batches` in the footer. It parses the value of each and
# escapes the texts popnei writes into them, the names of the individuals and
# of the chromosomes. Of its features only `std` is on: `preserve_order`
# would pull in indexmap, and popnei writes the keys of an object itself, in
# the order in which the spec gives them. It is pure Rust, what it pulls in,
# serde_core, itoa, zmij and memchr, is pure Rust too, and it builds for the
# two wasm targets.
serde_json = { version = "1", default-features = false, features = ["std"] }
# The error of the core crate. It writes the Display and the
# std::error::Error of the enum from the message on each variant, so that a
# case added by a later module cannot be a variant whose message was
# forgotten. It is a derive macro that runs on the host, with nothing of it
# in the built library, so it builds for the two wasm targets.
thiserror = "2"
# The Python binding crate. The names of pyo3 change from version to
# version, and .claude/skills/coding/pyo3.md was written from this one.
pyo3 = "0.29.2"
# Beside it, in the build script of the binding crate, for the link
# arguments of an extension module. It is a part of pyo3 and moves with it.
pyo3-build-config = "0.29.2"
# The arrays the Python binding crate hands to numpy: the genotypes, the
# positions and the qualities of a block leave the core as a Vec and reach
# numpy without a copy. It is the version of the numpy crate that goes with
# pyo3 0.29, and it moves with it.
numpy = "0.29"
# The JavaScript binding crate. The crate writes into the wasm file what
# the `wasm-bindgen` command line then reads to generate the JavaScript,
# and the two refuse to work together when their versions differ, so this
# one is pinned to the command line installed on the machine that builds,
# 0.2.128. Both move together: a new command line needs this line changed.
wasm-bindgen = "=0.2.128"

# The table of .claude/skills/coding/lints.toml, with the reasons for each
# lint in .claude/skills/coding/SKILL.md. Every crate takes it with
# [lints] workspace = true.

[workspace.lints.rust]
# The core crate also has #![forbid(unsafe_code)] in its lib.rs. The binding
# crate may need an unsafe block for an array, with #[expect] and a reason.
unsafe_code = "deny"

# Every pub item of a crate says what it is: the coding skill asks for a
# doc comment on each, and nothing checked it.
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# Integers: nothing that wraps or truncates in silence.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
fallible_impl_from = "deny"
# cast_precision_loss is left off: a count to f64 is exact below 2^53.

# No panics in library code. The tests are exempted in clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"

# Floats.
float_cmp = "deny"
# suboptimal_flops (nursery) stays off: it rewrites a * b + c into mul_add,
# which rounds differently from what R and plink2 compute.

# Types and API.
wildcard_enum_match_arm = "deny"
fn_params_excessive_bools = "deny"
match_same_arms = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# A lint is silenced with a reason, on the smallest item.
allow_attributes_without_reason = "deny"

[profile.test]
opt-level = 2 # numerical tests; overflow checks stay on

[profile.release]
overflow-checks = false # the code does not rely on them: see the coding skill

# The benchmarks are what a sampling profile of popnei is taken on, and
# `cargo bench` builds them with this profile, which inherits release. A
# release binary with no debug info gives a profile whose frames have no
# function name, so `sample` cannot say where the time went; the line
# tables are what it needs and they cost only the size of the binary,
# leaving the code the same as release. The methodology checklist of
# .claude/skills/performance-review has it.
[profile.bench]
debug = "line-tables-only"

# The release build with the debug information kept, for a sampling
# profiler. `sample` and the profilers of Instruments read it to name the
# frames that the compiler inlined, which in the principal component
# analysis is the whole of what standardizes a row. It changes no code
# generation: cargo passes `-C debuginfo=2` and nothing else, and the
# machine code of the closure that standardizes a row, 1664 instructions,
# is the same under this profile as under `release`, checked with `cargo
# asm -p popnei --lib` on 22 September 2026. A build under it is made with
# `cargo build --profile profiling` and lands in `target/profiling/`.
[profile.profiling]
inherits = "release"
debug = true
